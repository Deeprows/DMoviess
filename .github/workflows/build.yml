name: Build DamiMovies APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform
        run: flutter create . --platforms=android --project-name=damimovies --org com.damimovies
      - name: Patch Android native support
        run: |
          python3 tool/patch_main_activity.py
          python3 tool/patch_background_playback.py
          python3 tool/patch_android_manifest.py
      - name: Get dependencies
        run: flutter pub get
      - name: Generate app icon
        run: dart run flutter_launcher_icons
      - name: Build release APK
        run: flutter build apk --release --dart-define=TMDB_API_KEY="${{ secrets.TMDB_API_KEY }}" --dart-define=APP_VERSION="1.0.0"
      - uses: actions/upload-artifact@v4
        with:
          name: DamiMovies-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
