name: Build DamiMovies APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform
        run: flutter create . --platforms=android --project-name=damimovies --org com.damimovies
      - name: Patch Android native support
        run: |
          python3 tool/patch_main_activity.py
          python3 tool/patch_background_playback.py
          python3 tool/patch_android_manifest.py
          python3 tool/patch_release_signing.py
      - name: Get dependencies
        run: flutter pub get
      - name: Generate app icon
        run: dart run flutter_launcher_icons
      - name: Prepare release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "RELEASE_STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_KEYSTORE_BASE64 secret not set: APK will use a temporary key and Google sign-in will fail with error 10."
          fi
      - name: Show signing SHA-1
        run: |
          if [ -n "$RELEASE_KEYSTORE_PATH" ]; then
            keytool -list -v -keystore "$RELEASE_KEYSTORE_PATH" -alias "$RELEASE_KEY_ALIAS" -storepass "$RELEASE_STORE_PASSWORD" | grep -E "SHA1|SHA256" || true
          fi
      - name: Build release APK
        run: flutter build apk --release --no-shrink --dart-define=TMDB_API_KEY="${{ secrets.TMDB_API_KEY }}" --dart-define=APP_VERSION="1.0.0" --dart-define=AUTH_API_URL="${{ secrets.AUTH_API_URL }}" --dart-define=GOOGLE_WEB_CLIENT_ID="${{ secrets.GOOGLE_WEB_CLIENT_ID }}"
      - uses: actions/upload-artifact@v4
        with:
          name: DamiMovies-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
