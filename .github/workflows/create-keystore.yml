name: Create release keystore (run once)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate keystore
        env:
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          EXISTING_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$EXISTING_KEYSTORE" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 already exists. Creating a second key would break updates and Google sign-in. Delete that secret first only if you really want a new key."
            exit 1
          fi
          if [ ${#STORE_PASSWORD} -lt 8 ]; then
            echo "::error::Add a secret named RELEASE_STORE_PASSWORD (at least 8 characters) before running this workflow."
            exit 1
          fi
          keytool -genkeypair -v -storetype PKCS12 \
            -keystore damimovies-release.jks -alias damimovies \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$STORE_PASSWORD" -keypass "$STORE_PASSWORD" \
            -dname "CN=DamiMovies"
          echo "---- Register this SHA-1 in Google Cloud (Android OAuth client) ----"
          keytool -list -v -keystore damimovies-release.jks -alias damimovies \
            -storepass "$STORE_PASSWORD" | grep -E "SHA1|SHA256"
          base64 -w0 damimovies-release.jks > damimovies-release.jks.base64.txt
      - name: Upload keystore (kept for 1 day only)
        uses: actions/upload-artifact@v4
        with:
          name: damimovies-release-keystore
          path: |
            damimovies-release.jks
            damimovies-release.jks.base64.txt
          retention-days: 1
          if-no-files-found: error
