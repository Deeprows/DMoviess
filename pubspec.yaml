name: damimovies
description: DamiMovies - discover and watch movies.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Images and storage
  cached_network_image: ^3.4.1
  shared_preferences: ^2.5.6
  image_picker: ^1.1.2

  # Web and video playback
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.5.0
  video_player: ^2.10.0
  wakelock_plus: ^1.2.10
  url_launcher: ^6.3.1
  http: ^1.5.0

  # Downloads and device permissions
  flutter_downloader: ^1.11.8
  permission_handler: ^11.3.1
  path_provider: ^2.1.5
  open_filex: ^4.7.0

  # Sharing and Android integration
  share_plus: ^10.1.4
  android_intent_plus: ^5.2.0

  # Authentication and encryption
  google_sign_in: ^6.2.2
  cryptography: ^2.7.0

  # Firebase Core and Push Notifications
  firebase_core: ^4.4.0
  firebase_messaging: ^16.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/data/movies.json
    - assets/data/app_config.json
    - assets/data/support_damimovies.json
    - assets/data/share_damimovies.json
    - assets/icon/home_logo.png
    - assets/splash/splash.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#080B10"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
